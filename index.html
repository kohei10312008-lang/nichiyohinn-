<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日用品ストック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#DFE2DD;
  --card:#FFFFFF;
  --ink:#12161A;
  --dim:#68706C;
  --line:#CDD2CD;
  --red:#D62719;
  --red-bg:#FDF1EF;
  --amber:#D98214;
  --green:#0F7A5A;
  --tap:46px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:108px;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,select{font:inherit;color:inherit}
.mono{font-family:"Archivo",-apple-system,sans-serif;font-variant-numeric:tabular-nums}

/* ============ header ============ */
header{
  position:sticky;top:0;z-index:40;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 16px) 18px 0;box-shadow:0 1px 0 var(--line);
}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.28em;text-indent:.28em;line-height:1}
.stamp{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--dim);white-space:nowrap;line-height:1}
.tally{display:flex;gap:16px;margin:14px 0 0;align-items:baseline}
.tally div{display:flex;align-items:baseline;gap:5px}
.tally b{font-family:"Archivo",sans-serif;font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tally span{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--dim)}
.t-red b{color:var(--red)} .t-amber b{color:var(--amber)} .t-green b{color:var(--green)}

nav{display:flex;margin-top:14px}
nav button{flex:1;padding:12px 0 11px;font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--dim);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav .badge{
  display:inline-block;min-width:17px;height:17px;padding:0 4px;margin-left:3px;
  background:var(--red);color:#fff;border-radius:2px;font-family:"Archivo",sans-serif;
  font-size:11px;font-weight:800;line-height:17px;letter-spacing:0;vertical-align:1px;
}
nav .badge:empty{display:none}

/* ============ list ============ */
main{max-width:640px;margin:0 auto;padding:0 12px}
.cat{margin-bottom:26px}
.cat:first-child{margin-top:18px}
.cat-head{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:14px 6px 9px;background:var(--paper);
  font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--dim);
}
.cat-head::after{content:"";flex:1;height:2px;background:var(--line)}
.rows{background:var(--card);border-radius:3px;overflow:hidden}

.row{display:flex;align-items:center;gap:12px;position:relative;min-height:74px;padding:12px 12px 12px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:transparent}
.row.is-buy{background:var(--red-bg)}
.row.is-buy::before{background:var(--red)}
.row.is-low::before{background:var(--amber)}

.name-btn{flex:1;min-width:0;text-align:left;padding:8px 0;min-height:var(--tap)}
.name{display:block;font-size:17px;font-weight:800;letter-spacing:.01em;line-height:1.35;overflow-wrap:anywhere}
.tag-buy{display:inline-block;margin-right:7px;padding:2px 6px;border-radius:2px;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.1em;vertical-align:2px}
.meta{display:block;margin-top:5px;font-size:13px;color:var(--dim);line-height:1.5;overflow-wrap:anywhere}
.unit{display:inline-block;margin-right:6px;padding:1px 5px;border:1.5px solid var(--line);border-radius:2px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--dim)}
.last{display:block;margin-top:3px;font-size:12px;color:var(--dim);font-weight:600}

/* the three-band shelf tag */
.seg{display:flex;flex:none;border:2px solid var(--ink);border-radius:3px;overflow:hidden;background:var(--card)}
.seg button{
  min-width:46px;height:48px;padding:0 5px;border-left:2px solid var(--ink);
  font-family:"Archivo",sans-serif;font-size:13px;font-weight:800;letter-spacing:-.01em;
  color:var(--dim);background:var(--card);transition:background .1s,color .1s;white-space:nowrap;
}
.seg button:first-child{border-left:none}
.seg button.wide{font-size:11.5px}
.seg button[aria-pressed="true"]{color:#fff}
.seg .s0[aria-pressed="true"]{background:var(--red)}
.seg .s1[aria-pressed="true"]{background:var(--amber)}
.seg .s2[aria-pressed="true"]{background:var(--green)}

.add-btn{width:100%;padding:17px;margin-top:10px;border:2px dashed var(--line);border-radius:3px;font-size:13.5px;font-weight:800;letter-spacing:.1em;color:var(--dim)}
.add-btn:hover{border-color:var(--dim);color:var(--ink)}

/* ============ buy tab ============ */
.tags{display:flex;flex-direction:column;gap:10px}
.tag{position:relative;display:flex;align-items:center;gap:14px;padding:16px 16px 16px 40px;background:var(--card);border:2px solid var(--ink);border-radius:3px}
.tag::before{content:"";position:absolute;left:15px;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.tag-info{flex:1;min-width:0}
.tag-cat{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--dim);margin-bottom:3px}
.done{flex:none;padding:0 18px;height:44px;border-radius:3px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:800;letter-spacing:.08em}
.est{font-family:"Archivo",sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:72px 24px 40px}
.empty b{display:block;font-size:19px;font-weight:800;letter-spacing:.06em;margin-bottom:9px}
.empty span{font-size:14px;color:var(--dim);line-height:1.7}
.stamp-btn{display:block;width:100%;max-width:300px;margin:26px auto 0;padding:16px;border:2px solid var(--ink);border-radius:3px;background:transparent;font-size:13.5px;font-weight:800;letter-spacing:.1em}
.stamp-btn:disabled{border-color:var(--line);color:var(--dim);cursor:default}
.subtotal{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding:14px 16px;background:var(--card);border-radius:3px}
.subtotal span{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--dim)}
.subtotal b{font-family:"Archivo",sans-serif;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.subtotal b small{font-size:13px;margin-left:2px}

/* ============ record tab ============ */
.period{display:flex;border:2px solid var(--ink);border-radius:3px;overflow:hidden;margin:18px 0 18px}
.period button{flex:1;height:44px;font-size:13px;font-weight:800;letter-spacing:.06em;border-left:2px solid var(--ink);color:var(--dim);background:var(--card)}
.period button:first-child{border-left:none}
.period button[aria-selected="true"]{background:var(--ink);color:#fff}
.total{background:var(--ink);color:#fff;border-radius:3px;padding:20px}
.total p{margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.55)}
.total b{font-family:"Archivo",sans-serif;font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;display:block}
.total b small{font-size:17px;margin-left:4px;font-weight:800}
.total .sub{margin-top:14px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.6)}
.brk{background:var(--card);border-radius:3px;padding:16px}
.brk-row{margin-bottom:15px}
.brk-row:last-child{margin-bottom:0}
.brk-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;font-weight:800;margin-bottom:6px}
.brk-top em{font-style:normal;font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.brk-bar{height:8px;background:#EDEFEC;border-radius:2px;overflow:hidden}
.brk-bar i{display:block;height:100%;background:var(--ink);border-radius:2px}
.rank{background:var(--card);border-radius:3px;overflow:hidden}
.rank-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.rank-row:first-child{border-top:none}
.rank-name{flex:1;min-width:0;font-size:15px;font-weight:800;overflow-wrap:anywhere}
.rank-name span{display:block;font-size:12px;color:var(--dim);font-weight:600;margin-top:3px}
.rank-sum{font-family:"Archivo",sans-serif;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist{background:var(--card);border-radius:3px;overflow:hidden}
.hist-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-top:1px solid var(--line);text-align:left}
.hist-row:first-child{border-top:none}
.hist-date{font-family:"Archivo",sans-serif;font-size:12.5px;font-weight:700;color:var(--dim);width:44px;flex:none;font-variant-numeric:tabular-nums}
.hist-name{flex:1;min-width:0;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.hist-name i{font-style:normal;color:var(--dim);font-size:12.5px;margin-left:5px}
.hist-price{font-family:"Archivo",sans-serif;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist-price.none{color:var(--red);font-family:inherit;font-size:12px;font-weight:800}
.more-btn{width:100%;padding:14px;margin-top:8px;font-size:12.5px;font-weight:800;letter-spacing:.1em;color:var(--dim)}

/* ============ bottom bar ============ */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px;padding-bottom:calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--paper) 62%,rgba(223,226,221,0))}
.bar button{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:616px;margin:0 auto;padding:16px 22px;border-radius:3px;background:var(--ink);color:#fff}
.bar.none button{background:var(--green)}
.bar .label{font-size:13.5px;font-weight:800;letter-spacing:.1em}
.bar .count{font-family:"Archivo",sans-serif;font-size:27px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bar .count small{font-size:13px;font-weight:800;margin-left:3px;letter-spacing:.06em}

/* ============ sheet ============ */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(18,22,26,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:640px;margin:0 auto;max-height:90vh;overflow-y:auto;
  background:var(--card);border-radius:6px 6px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.open{transform:translateY(0)}
.sheet h2{margin:0 0 20px;font-size:13px;font-weight:800;letter-spacing:.2em}
.field{margin-bottom:17px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--dim);margin-bottom:7px}
.field input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:3px;background:#F7F8F6;font-size:16px;font-weight:600}
.field select{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:3px;background:#F7F8F6;font-size:16px;font-weight:600}
.field input:focus,.field select:focus{outline:none;border-color:var(--ink);background:#fff}
.hint{font-size:12.5px;color:var(--dim);margin:7px 0 0;line-height:1.55}
.pair{display:flex;gap:10px}
.pair .field{flex:1;margin-bottom:0}
.preview{margin:14px 0 0;padding:13px 14px;background:#F7F8F6;border-radius:3px}
.preview p{margin:0 0 9px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--dim)}
.pv-rows{display:flex;flex-direction:column;gap:6px}
.pv{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700}
.pv i{width:11px;height:11px;border-radius:2px;flex:none;font-style:normal}
.pv .p0{background:var(--red)} .pv .p1{background:var(--amber)} .pv .p2{background:var(--green)}
.pv em{font-style:normal;color:var(--dim);font-weight:600;font-size:12.5px}
.sheet-actions{display:flex;gap:10px;margin-top:24px}
.sheet-actions button{flex:1;padding:16px;border-radius:3px;font-size:14px;font-weight:800;letter-spacing:.08em}
.btn-save{background:var(--ink);color:#fff}
.btn-cancel{background:#EDEFEC;color:var(--dim)}
.btn-del{width:100%;margin-top:12px;padding:14px;color:var(--red);font-size:13px;font-weight:800;letter-spacing:.06em}

:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.seg button{min-width:42px;font-size:12px}.name{font-size:16px}nav button{font-size:11.5px}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>日用品ストック</h1>
    <div class="stamp" id="stamp"></div>
  </div>
  <div class="tally" id="tally"></div>
  <nav id="nav">
    <button data-tab="week" aria-selected="true">週次<span class="badge" data-b="week"></span></button>
    <button data-tab="month" aria-selected="false">月次<span class="badge" data-b="month"></span></button>
    <button data-tab="year" aria-selected="false">年次<span class="badge" data-b="year"></span></button>
    <button data-tab="buy" aria-selected="false">買うもの</button>
    <button data-tab="rec" aria-selected="false">記録</button>
  </nav>
</header>

<main id="main"></main>

<div class="bar" id="bar"><button id="barBtn"></button></div>

<div class="backdrop" id="backdrop"></div>

<!-- 品目の設定 -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle">品目の設定</h2>
  <div class="field">
    <label for="f-name">品名</label>
    <input id="f-name" type="text" placeholder="例：食器用洗剤">
  </div>
  <div class="field">
    <label for="f-memo">メモ（銘柄・容量・購入先）</label>
    <input id="f-memo" type="text" placeholder="例：キュキュット 240ml／西友">
  </div>
  <div class="field">
    <label for="f-price">目安価格（円）</label>
    <input id="f-price" type="number" min="0" max="999999" inputmode="numeric" placeholder="例：198">
    <p class="hint">「買った」を押したとき、この金額で記録されます。違ったら記録タブで直せます。</p>
  </div>
  <div class="field">
    <label for="f-unit">数える単位</label>
    <input id="f-unit" type="text" placeholder="例：本・ロール・枚（空欄なら「予備の数」）">
  </div>
  <div class="pair">
    <div class="field">
      <label for="f-red">買う（赤）</label>
      <input id="f-red" type="number" min="0" max="999" inputmode="numeric">
      <p class="hint">この数以下</p>
    </div>
    <div class="field">
      <label for="f-amber">そろそろ（黄）</label>
      <input id="f-amber" type="number" min="1" max="999" inputmode="numeric">
      <p class="hint">この数以下</p>
    </div>
  </div>
  <div class="preview">
    <p>ボタンの表示</p>
    <div class="pv-rows" id="preview"></div>
  </div>
  <div class="field" style="margin-top:17px">
    <label for="f-freq">確認頻度</label>
    <select id="f-freq">
      <option value="week">週次</option>
      <option value="month">月次</option>
      <option value="year">年次</option>
    </select>
  </div>
  <div class="field">
    <label for="f-cat">カテゴリ</label>
    <input id="f-cat" type="text" list="catlist" placeholder="例：キッチン">
    <datalist id="catlist"></datalist>
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="btnCancel">やめる</button>
    <button class="btn-save" id="btnSave">保存する</button>
  </div>
  <button class="btn-del" id="btnDel">この品目を削除する</button>
</div>

<!-- 購入記録 -->
<div class="sheet" id="logSheet" role="dialog" aria-modal="true" aria-labelledby="logTitle">
  <h2 id="logTitle">購入の記録</h2>
  <div class="field" id="logPickWrap">
    <label for="g-item">品目</label>
    <select id="g-item"></select>
  </div>
  <div class="field" id="logNameWrap">
    <label for="g-name">品名</label>
    <input id="g-name" type="text">
  </div>
  <div class="field">
    <label for="g-date">購入日</label>
    <input id="g-date" type="date">
  </div>
  <div class="pair">
    <div class="field">
      <label for="g-price">価格（円）</label>
      <input id="g-price" type="number" min="0" max="999999" inputmode="numeric">
    </div>
    <div class="field">
      <label for="g-qty">個数</label>
      <input id="g-qty" type="number" min="1" max="99" inputmode="numeric">
    </div>
  </div>
  <p class="hint" id="g-sub"></p>
  <div class="sheet-actions">
    <button class="btn-cancel" id="btnLogCancel">やめる</button>
    <button class="btn-save" id="btnLogSave">保存する</button>
  </div>
  <button class="btn-del" id="btnLogDel">この記録を削除する</button>
</div>

<script>
const KEY='stock:v1';

/* [頻度, カテゴリ, 品名, 赤ライン, 黄ライン, 単位, 目安価格] */
const PRESET=[

 ['month','キッチン','キッチン泡ハイター',0,1,'',300],
 ['month','洗面・風呂','シャンプー',0,1,'',800],['month','洗面・風呂','コンディショナー',0,1,'',800],
 ['month','洗面・風呂','ボディソープ',0,1,'',700],['month','洗面・風呂','洗顔料',0,1,'',600],
 ['month','洗面・風呂','歯磨き粉',0,1,'',400],['month','洗面・風呂','歯ブラシ',2,4,'本',300],
 ['month','洗面・風呂','デンタルフロス',0,1,'',400],['month','洗面・風呂','髭剃り替刃',1,3,'個',1500],
 ['month','洗面・風呂','風呂用洗剤',0,1,'',350],['month','洗面・風呂','入浴剤',0,1,'',600],
 ['month','トイレ','トイレ洗剤',0,1,'',300],['month','トイレ','流せるクリーナー',0,1,'',300],['month','トイレ','消臭剤',0,1,'',400],
 ['month','洗濯','漂白剤',0,1,'',300],['month','洗濯','洗濯槽クリーナー',0,1,'',400],['month','洗濯','洗濯ネット',0,1,'',400],

 ['month','掃除','除菌シート',0,1,'',300],['month','掃除','ゴム手袋',0,1,'',300],['month','掃除','重曹・クエン酸',0,1,'',300],
 ['month','薬・救急','解熱鎮痛薬',0,1,'',800],['month','薬・救急','風邪薬',0,1,'',1200],['month','薬・救急','胃腸薬',0,1,'',900],
 ['month','薬・救急','消毒液',0,1,'',500],['month','薬・救急','絆創膏',5,15,'枚',400],['month','薬・救急','湿布',5,15,'枚',800],
 ['year','設備','乾電池（単3）',2,6,'本',600],['year','設備','乾電池（単4）',2,6,'本',600],
 ['year','設備','電球・LED',0,1,'',1000],['year','設備','火災警報器（電池／本体10年）',0,1,'',3500],
 ['year','設備','換気扇フィルター',1,3,'枚',500],['year','設備','エアコンフィルター',0,1,'',1000],
 ['year','設備','浄水器カートリッジ',0,1,'',3000],['year','設備','ライター・チャッカマン',0,1,'',200],
 ['year','季節','虫除け・殺虫剤',0,1,'',800],['year','季節','カイロ',5,15,'個',500],
 ['year','季節','除湿剤',1,3,'個',500],['year','季節','加湿器フィルター',0,1,'',1500],
 ['year','季節','日焼け止め',0,1,'',900],['year','季節','衣類用防虫剤',0,1,'',600],
 ['year','備蓄','飲料水（2L）',6,12,'本',700],['year','備蓄','レトルト・非常食',6,12,'食',1500],
 ['year','備蓄','カセットボンベ',3,6,'本',500],
];
/* 既存データに目安価格を補う用 */
const PRICE_BY_NAME={}; PRESET.forEach(p=>PRICE_BY_NAME[p[2]]=p[6]);

const FREQ_LABEL={week:'週次',month:'月次',year:'年次'};
let state=null, tab='week', period='month', histLimit=20;
let editingId=null, editingLogId=null, saveTimer=null, lastBuy={};

/* ---------- 日付 ---------- */
function todayStr(d){
  d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const shortDate=s=>{const p=s.split('-');return (+p[1])+'/'+(+p[2]);};
function daysAgo(s){
  const p=s.split('-').map(Number);
  const then=new Date(p[0],p[1]-1,p[2]);
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((now-then)/86400000);
}
const yen=n=>n.toLocaleString('ja-JP');

/* ---------- 保存 ---------- */
function seed(){
  return {
    items:PRESET.map((p,i)=>({id:'i'+i,freq:p[0],cat:p[1],name:p[2],red:p[3],amber:p[4],unit:p[5],price:p[6],memo:'',band:2})),
    seq:PRESET.length, lastCheck:null, log:[], logSeq:0
  };
}
function migrate(s){
  s.items.forEach(it=>{
    if(it.red===undefined){
      const bl=it.buyLine||0;
      it.red=bl; it.amber=bl+1; it.unit=it.unit||'';
      delete it.buyLine;
    }
    if(it.band===undefined){ it.band = it.count!==undefined ? it.count : 2; delete it.count; }
    if(it.amber<=it.red) it.amber=it.red+1;
    if(it.price===undefined) it.price = PRICE_BY_NAME[it.name] || 0;
  });
  if(!Array.isArray(s.log)) s.log=[];
  if(s.logSeq===undefined) s.logSeq=s.log.length;
  return s;
}
async function load(){
  try{
    const r=await window.storage.get(KEY);
    state=r&&r.value?migrate(JSON.parse(r.value)):seed();
  }catch(e){ state=seed(); }
  render();
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{ await window.storage.set(KEY,JSON.stringify(state)); }
    catch(e){ console.error('保存できませんでした',e); }
  },250);
}

/* ---------- 判定 ---------- */
const status=it=> it.band===0 ? 'buy' : (it.band===1 ? 'low' : 'ok');
const buyList=()=>state.items.filter(it=>status(it)==='buy');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isSimple=it=>!it.unit && it.red===0 && it.amber===1;

function bandLabels(it){
  if(isSimple(it)) return ['0','1','2+'];
  const a=`${it.red}以下`;
  const b=(it.amber===it.red+1) ? `${it.amber}` : `${it.red+1}-${it.amber}`;
  const c=`${it.amber+1}+`;
  return [a,b,c];
}
function bandWords(it){
  const l=bandLabels(it), u=it.unit||'';
  return isSimple(it)
    ? ['予備なし','予備1つ','予備2つ以上']
    : [l[0]+u, l[1]+u, l[2].replace('+','')+u+'以上'];
}

/* ---------- 記録 ---------- */
function addLog(it){
  state.log.push({
    id:'L'+(state.logSeq++), itemId:it.id, name:it.name, cat:it.cat,
    date:todayStr(), price:it.price||0, qty:1
  });
}
function buildLastBuy(){
  lastBuy={};
  state.log.forEach(l=>{
    if(!l.itemId) return;
    if(!lastBuy[l.itemId] || l.date>lastBuy[l.itemId].date) lastBuy[l.itemId]=l;
  });
}
function periodLog(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth()+1;
  const ym=y+'-'+String(m).padStart(2,'0');
  if(period==='month') return state.log.filter(l=>l.date.startsWith(ym));
  if(period==='year')  return state.log.filter(l=>l.date.startsWith(y+'-'));
  return state.log.slice();
}

/* ---------- render ---------- */
function render(){
  buildLastBuy();
  renderHeader();
  const main=document.getElementById('main');
  main.innerHTML = tab==='buy' ? viewBuy() : tab==='rec' ? viewRec() : viewList(tab);
  renderBar();
  document.getElementById('catlist').innerHTML=
    [...new Set(state.items.map(i=>i.cat))].map(c=>`<option value="${esc(c)}">`).join('');
}

function renderHeader(){
  const c={buy:0,low:0,ok:0};
  state.items.forEach(it=>c[status(it)]++);
  document.getElementById('tally').innerHTML=`
    <div class="t-red"><b>${c.buy}</b><span>買う</span></div>
    <div class="t-amber"><b>${c.low}</b><span>のこり少</span></div>
    <div class="t-green"><b>${c.ok}</b><span>ある</span></div>`;
  document.getElementById('stamp').textContent =
    state.lastCheck ? 'CHECKED '+state.lastCheck : 'NOT CHECKED';
  ['week','month','year'].forEach(f=>{
    const k=state.items.filter(it=>it.freq===f&&status(it)==='buy').length;
    document.querySelector(`.badge[data-b="${f}"]`).textContent=k||'';
  });
  document.querySelectorAll('#nav button').forEach(b=>
    b.setAttribute('aria-selected', b.dataset.tab===tab));
}

function viewList(freq){
  const items=state.items.filter(it=>it.freq===freq);
  const cats=[...new Set(items.map(i=>i.cat))];
  return cats.map(cat=>`
    <section class="cat">
      <div class="cat-head">${esc(cat)}</div>
      <div class="rows">${items.filter(i=>i.cat===cat).map(rowHTML).join('')}</div>
    </section>`).join('')
    + `<button class="add-btn" data-new="${freq}">＋ ${FREQ_LABEL[freq]}に品目を追加</button>`;
}

function rowHTML(it){
  const st=status(it), labels=bandLabels(it), words=bandWords(it);
  const wide=labels.some(l=>l.length>3);
  const metaBits=[];
  if(it.unit) metaBits.push(`<span class="unit">${esc(it.unit)}</span>`);
  if(it.memo) metaBits.push(esc(it.memo));
  const lb=lastBuy[it.id];
  const lastLine = lb ? `<span class="last">前回 ${shortDate(lb.date)}（${daysAgo(lb.date)}日前）</span>` : '';
  return `<div class="row ${st==='buy'?'is-buy':st==='low'?'is-low':''}">
    <button class="name-btn" data-edit="${it.id}">
      <span class="name">${st==='buy'?'<span class="tag-buy">買う</span>':''}${esc(it.name)}</span>
      ${metaBits.length?`<span class="meta">${metaBits.join('')}</span>`:''}
      ${lastLine}
    </button>
    <div class="seg" role="group" aria-label="${esc(it.name)}の在庫">
      ${[0,1,2].map(v=>`<button class="s${v}${wide?' wide':''}" data-set="${it.id}" data-v="${v}"
        aria-pressed="${it.band===v}" aria-label="${esc(words[v])}">${esc(labels[v])}</button>`).join('')}
    </div>
  </div>`;
}

function viewBuy(){
  const list=buyList();
  if(!list.length) return `<div class="empty">
      <b>買うものはありません</b>
      <span>赤の帯に入った品目が<br>ここに集まります。</span>
      <button class="stamp-btn" id="btnStamp">今日チェックした</button>
    </div>`;
  const est=list.reduce((s,it)=>s+(it.price||0),0);
  return `<section class="cat">
      <div class="cat-head">買うもの ${list.length}点</div>
      <div class="tags">
        ${list.map(it=>{
          const bits=[];
          if(!isSimple(it)) bits.push(`${it.red}${esc(it.unit||'')}以下`);
          if(it.price) bits.push(`<span class="est">${yen(it.price)}円</span>`);
          if(it.memo) bits.push(esc(it.memo));
          return `<div class="tag">
            <div class="tag-info">
              <div class="tag-cat">${esc(it.cat)}</div>
              <div class="name">${esc(it.name)}</div>
              ${bits.length?`<div class="meta">${bits.join('　')}</div>`:''}
            </div>
            <button class="done" data-bought="${it.id}">買った</button>
          </div>`;
        }).join('')}
      </div>
      <div class="subtotal"><span>小計（目安）</span><b>${yen(est)}<small>円</small></b></div>
      <button class="stamp-btn" id="btnStamp">今日チェックした</button>
    </section>`;
}

function viewRec(){
  const logs=periodLog();
  const total=logs.reduce((s,l)=>s+(l.price||0)*(l.qty||1),0);
  const label={month:'今月',year:'今年',all:'全期間'}[period];
  const missing=logs.filter(l=>!l.price).length;

  let html=`<div class="period" id="periodCtl">
    ${['month','year','all'].map(p=>`<button data-p="${p}" aria-selected="${period===p}">${
      {month:'今月',year:'今年',all:'全期間'}[p]}</button>`).join('')}
  </div>`;

  html+=`<div class="total">
    <p>${label}の合計</p>
    <b>${yen(total)}<small>円</small></b>
    <div class="sub">${logs.length}件の購入${missing?`　・　価格未入力 ${missing}件`:''}</div>
  </div>`;

  if(!logs.length){
    html+=`<div class="empty"><b>まだ記録がありません</b>
      <span>買うものタブで「買った」を押すと<br>ここに積み上がります。</span></div>`;
    html+=`<button class="add-btn" id="btnLogNew">＋ 購入を手入力する</button>`;
    return html;
  }

  /* カテゴリ別 */
  const byCat={};
  logs.forEach(l=>{ byCat[l.cat]=(byCat[l.cat]||0)+(l.price||0)*(l.qty||1); });
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max=cats[0][1]||1;
  html+=`<section class="cat"><div class="cat-head">カテゴリ別</div>
    <div class="brk">${cats.map(([c,v])=>`
      <div class="brk-row">
        <div class="brk-top"><span>${esc(c)}</span><em>${yen(v)}円</em></div>
        <div class="brk-bar"><i style="width:${Math.max(2,v/max*100)}%"></i></div>
      </div>`).join('')}
    </div></section>`;

  /* 品目別 */
  const byItem={};
  logs.forEach(l=>{
    const k=l.itemId||l.name;
    if(!byItem[k]) byItem[k]={name:l.name,count:0,sum:0,qty:0};
    byItem[k].count++; byItem[k].qty+=(l.qty||1); byItem[k].sum+=(l.price||0)*(l.qty||1);
  });
  const ranked=Object.values(byItem).sort((a,b)=>b.sum-a.sum);
  html+=`<section class="cat"><div class="cat-head">品目別</div>
    <div class="rank">${ranked.map(r=>`
      <div class="rank-row">
        <div class="rank-name">${esc(r.name)}
          <span>${r.count}回　平均 ${yen(Math.round(r.sum/Math.max(1,r.qty)))}円</span>
        </div>
        <div class="rank-sum">${yen(r.sum)}円</div>
      </div>`).join('')}
    </div></section>`;

  /* 履歴 */
  const sorted=logs.slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1));
  const shown=sorted.slice(0,histLimit);
  html+=`<section class="cat"><div class="cat-head">履歴</div>
    <div class="hist">${shown.map(l=>`
      <button class="hist-row" data-log="${l.id}">
        <span class="hist-date">${shortDate(l.date)}</span>
        <span class="hist-name">${esc(l.name)}${(l.qty||1)>1?`<i>×${l.qty}</i>`:''}</span>
        ${l.price?`<span class="hist-price">${yen(l.price*(l.qty||1))}円</span>`
                 :`<span class="hist-price none">未入力</span>`}
      </button>`).join('')}
    </div>
    ${sorted.length>histLimit?`<button class="more-btn" id="btnMore">もっと見る（残り${sorted.length-histLimit}件）</button>`:''}
    <button class="add-btn" id="btnLogNew">＋ 購入を手入力する</button>
  </section>`;
  return html;
}

function renderBar(){
  const n=buyList().length;
  const bar=document.getElementById('bar');
  bar.classList.toggle('none',n===0);
  document.getElementById('barBtn').innerHTML = n
    ? `<span class="label">買うもの</span><span class="count">${n}<small>点</small></span>`
    : `<span class="label">在庫は足りています</span><span class="count">✓</span>`;
}

/* ---------- events ---------- */
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  tab=b.dataset.tab; histLimit=20; render(); window.scrollTo(0,0);
});
document.getElementById('barBtn').addEventListener('click',()=>{ tab='buy'; render(); window.scrollTo(0,0); });

document.getElementById('main').addEventListener('click',e=>{
  const set=e.target.closest('[data-set]');
  if(set){ const it=state.items.find(i=>i.id===set.dataset.set);
    it.band=+set.dataset.v; save(); render(); return; }

  const bought=e.target.closest('[data-bought]');
  if(bought){ const it=state.items.find(i=>i.id===bought.dataset.bought);
    it.band=2; addLog(it); save(); render(); return; }

  const ed=e.target.closest('[data-edit]');
  if(ed){ openSheet(ed.dataset.edit); return; }

  const nw=e.target.closest('[data-new]');
  if(nw){ openSheet(null,nw.dataset.new); return; }

  const pc=e.target.closest('[data-p]');
  if(pc){ period=pc.dataset.p; histLimit=20; render(); return; }

  const lg=e.target.closest('[data-log]');
  if(lg){ openLogSheet(lg.dataset.log); return; }

  if(e.target.id==='btnMore'){ histLimit+=40; render(); return; }
  if(e.target.id==='btnLogNew'){ openLogSheet(null); return; }

  if(e.target.id==='btnStamp'){
    state.lastCheck=new Date().toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
    save(); renderHeader();
    e.target.textContent='チェック済み'; e.target.disabled=true;
  }
});

/* ---------- 品目シート ---------- */
const sheet=document.getElementById('sheet'), backdrop=document.getElementById('backdrop');
const logSheet=document.getElementById('logSheet');
const $=id=>document.getElementById(id);

function readForm(){
  let red=parseInt($('f-red').value,10); if(isNaN(red)||red<0) red=0;
  let amber=parseInt($('f-amber').value,10); if(isNaN(amber)) amber=red+1;
  if(amber<=red) amber=red+1;
  return {red,amber,unit:$('f-unit').value.trim()};
}
function drawPreview(){
  const f=readForm();
  const w=bandWords({red:f.red,amber:f.amber,unit:f.unit});
  $('preview').innerHTML=[0,1,2].map(i=>
    `<div class="pv"><i class="p${i}"></i>${esc(w[i])} <em>${['→ 買う','→ そろそろ','→ ある'][i]}</em></div>`
  ).join('');
}
['f-red','f-amber','f-unit'].forEach(id=>$(id).addEventListener('input',drawPreview));

function openSheet(id,freq){
  editingId=id;
  const it=id?state.items.find(i=>i.id===id):null;
  $('sheetTitle').textContent=it?'品目の設定':'品目を追加';
  $('f-name').value=it?it.name:'';
  $('f-memo').value=it?it.memo:'';
  $('f-price').value=it?(it.price||''):'';
  $('f-unit').value=it?it.unit:'';
  $('f-red').value=it?it.red:0;
  $('f-amber').value=it?it.amber:1;
  $('f-freq').value=it?it.freq:(freq||'week');
  $('f-cat').value=it?it.cat:'';
  $('btnDel').style.display=it?'block':'none';
  drawPreview();
  sheet.classList.add('open'); backdrop.classList.add('open');
  sheet.scrollTop=0;
  if(!it) setTimeout(()=>$('f-name').focus(),280);
}
function closeAll(){
  sheet.classList.remove('open'); logSheet.classList.remove('open');
  backdrop.classList.remove('open'); editingId=null; editingLogId=null;
}
backdrop.addEventListener('click',closeAll);
$('btnCancel').addEventListener('click',closeAll);
$('btnLogCancel').addEventListener('click',closeAll);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(sheet.classList.contains('open')||logSheet.classList.contains('open'))) closeAll();
});

$('btnSave').addEventListener('click',()=>{
  const name=$('f-name').value.trim();
  if(!name){ $('f-name').focus(); return; }
  const f=readForm();
  let price=parseInt($('f-price').value,10); if(isNaN(price)||price<0) price=0;
  const data={
    name, memo:$('f-memo').value.trim(), price,
    unit:f.unit, red:f.red, amber:f.amber,
    freq:$('f-freq').value,
    cat:$('f-cat').value.trim()||'その他'
  };
  if(editingId) Object.assign(state.items.find(i=>i.id===editingId),data);
  else{ state.items.push({id:'n'+(state.seq++),band:2,...data}); tab=data.freq; }
  save(); closeAll(); render();
});
$('btnDel').addEventListener('click',()=>{
  const it=state.items.find(i=>i.id===editingId);
  if(!confirm(`「${it.name}」を削除しますか？\n（購入の記録は残ります）`)) return;
  state.items=state.items.filter(i=>i.id!==editingId);
  save(); closeAll(); render();
});

/* ---------- 記録シート ---------- */
function updateLogSub(){
  const p=parseInt($('g-price').value,10)||0;
  const q=parseInt($('g-qty').value,10)||1;
  $('g-sub').textContent = q>1 ? `小計 ${yen(p*q)}円` : '';
}
['g-price','g-qty'].forEach(id=>$(id).addEventListener('input',updateLogSub));

$('g-item').addEventListener('change',()=>{
  if(editingLogId) return;
  const it=state.items.find(i=>i.id===$('g-item').value);
  if(it){ $('g-price').value=it.price||''; updateLogSub(); }
});

function openLogSheet(logId){
  editingLogId=logId;
  const l=logId?state.log.find(x=>x.id===logId):null;
  $('logTitle').textContent=l?'記録を編集':'購入を記録';

  if(l){
    $('logPickWrap').style.display='none';
    $('logNameWrap').style.display='block';
    $('g-name').value=l.name;
    $('g-date').value=l.date;
    $('g-price').value=l.price||'';
    $('g-qty').value=l.qty||1;
    $('btnLogDel').style.display='block';
  }else{
    $('logPickWrap').style.display='block';
    $('logNameWrap').style.display='none';
    $('g-item').innerHTML=state.items.map(i=>
      `<option value="${i.id}">${esc(i.cat)}／${esc(i.name)}</option>`).join('');
    const first=state.items[0];
    $('g-date').value=todayStr();
    $('g-price').value=first?(first.price||''):'';
    $('g-qty').value=1;
    $('btnLogDel').style.display='none';
  }
  updateLogSub();
  logSheet.classList.add('open'); backdrop.classList.add('open');
  logSheet.scrollTop=0;
}

$('btnLogSave').addEventListener('click',()=>{
  let price=parseInt($('g-price').value,10); if(isNaN(price)||price<0) price=0;
  let qty=parseInt($('g-qty').value,10); if(isNaN(qty)||qty<1) qty=1;
  const date=$('g-date').value||todayStr();

  if(editingLogId){
    const l=state.log.find(x=>x.id===editingLogId);
    const nm=$('g-name').value.trim();
    Object.assign(l,{name:nm||l.name,date,price,qty});
  }else{
    const it=state.items.find(i=>i.id===$('g-item').value);
    if(!it) return;
    state.log.push({id:'L'+(state.logSeq++),itemId:it.id,name:it.name,cat:it.cat,date,price,qty});
  }
  save(); closeAll(); render();
});

$('btnLogDel').addEventListener('click',()=>{
  const l=state.log.find(x=>x.id===editingLogId);
  if(!confirm(`${shortDate(l.date)}「${l.name}」の記録を削除しますか？`)) return;
  state.log=state.log.filter(x=>x.id!==editingLogId);
  save(); closeAll(); render();
});

load();
</script>
</body>
</html>
